<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css?v=42">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tema.js?v=42"></script>
</head>
<body class="bg-[#07050d] text-white min-h-screen flex flex-col font-sans antialiased">

  <!-- Header Global -->
  <header id="encabezado"></header>
  <script src="js/encabezado.js?v=42"></script>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <p class="text-xs font-semibold tracking-[0.25em] text-pink-400 uppercase">Cuidado profesional</p>
        <h1 class="text-4xl font-serif font-bold mt-1">Tienda BellaStyle</h1>
        <p class="text-white/70 text-sm mt-2 max-w-xl">Productos que usan nuestras estilistas. Arma tu pedido y lo recoges y pagas en el salón.</p>
      </div>
      <button type="button" id="btnAbrirCarrito" class="btn-primario px-5 py-2.5 flex items-center gap-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        Ver carrito (<span id="cantidadCarrito">0</span>)
      </button>
    </div>
    <div id="listaProductos" class="grid gap-4 grid-cols-2 lg:grid-cols-4">
      <div class="esqueleto h-64"></div><div class="esqueleto h-64"></div><div class="esqueleto h-64"></div><div class="esqueleto h-64"></div>
    </div>
  </main>

  <!-- Carrito: panel que se desliza desde la derecha -->
  <div id="fondoCarrito" class="fixed inset-0 z-[60] hidden bg-black/60"></div>
  <aside id="carrito" class="fixed inset-y-0 right-0 z-[61] flex w-full max-w-md translate-x-full flex-col border-l border-white/10 bg-[#120f1d] text-white shadow-2xl transition-transform duration-300" aria-label="Carrito de compras" aria-hidden="true">
    <div class="flex items-center justify-between border-b border-white/10 p-5">
      <h2 class="font-serif text-2xl font-bold">Tu carrito</h2>
      <button type="button" id="btnCerrarCarrito" class="rounded-lg px-2 text-2xl leading-none text-white/70 hover:bg-white/10" aria-label="Cerrar carrito">&times;</button>
    </div>
    <div id="itemsCarrito" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
    <div class="border-t border-white/10 p-5 space-y-3">
      <div class="flex items-center justify-between text-lg font-bold"><span>Total</span><span id="totalCarrito" class="text-amber-300">$0</span></div>
      <p class="text-xs text-white/60">Pagas y recoges en el salón. Te avisamos cuando tu pedido esté listo.</p>
      <div id="alertaCarrito" class="alerta hidden"></div>
      <button type="button" id="btnHacerPedido" class="btn-primario w-full py-3">Hacer pedido</button>
    </div>
  </aside>

  <footer class="border-t border-white/10 py-6 text-center text-xs text-white/50 backdrop-blur-md bg-black/40">
    BellaStyle Manager · Proyecto de Aula · Ingeniería de Sistemas
  </footer>

  <script src="js/api.js?v=42"></script>
  <script src="js/catalogo.js?v=42"></script>
  <script src="js/tienda.js?v=42"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07060b">
  <title>Sin conexión | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07060b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    img{width:96px;height:96px;border-radius:50%}
    h1{font-family:Georgia,serif;font-size:26px;margin:18px 0 8px}
    h1 span{color:#f472b6}
    p{color:rgba(255,255,255,.7);max-width:32ch;margin:0 auto 22px;line-height:1.5}
    button{font:inherit;font-weight:600;background:#f9a8d4;color:#1f1020;border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="img/logo.webp" alt="BellaStyle">
    <h1>Bella<span>Style</span></h1>
    <p>No hay conexión a internet. Revisa tu wifi o tus datos e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>

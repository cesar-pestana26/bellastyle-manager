<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07060b">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BellaStyle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <meta name="description" content="BellaStyle: agenda tu cita en el salón de belleza en minutos.">
  <meta name="theme-color" content="#f7d3e2">
  <link rel="stylesheet" href="css/estilos.css?v=45">
  <script src="js/tema.js?v=51"></script>
  <script src="js/pwa.js?v=52" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07050d] text-white min-h-screen flex flex-col font-sans antialiased">
  <header id="encabezado"></header>
  <script src="js/encabezado.js?v=53"></script>
    <div class="flex flex-1 flex-col px-4 sm:px-6 pt-4 pb-24 sm:pb-6">

      <!-- Formulario principal -->
      <main class="relative flex flex-1 items-center justify-center py-10">
        <!-- Silueta del salón de fondo (decorativa) -->
        <div class="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden" aria-hidden="true">
          <div class="md:-translate-x-[16rem] lg:-translate-x-[22rem] xl:-translate-x-[27rem]">
            <div class="animar-flotar">
              <img src="img/silueta-oscuro.webp" alt="" class="silueta silueta-oscuro w-[34rem] md:w-[30rem] lg:w-[38rem] max-w-none opacity-50 md:opacity-80">
              <img src="img/silueta-claro.webp" alt="" class="silueta silueta-claro w-[34rem] md:w-[30rem] lg:w-[38rem] max-w-none opacity-60 md:opacity-90">
            </div>
          </div>
        </div>
        <section class="relative z-10 tarjeta animate-aparecer w-full max-w-md p-6 sm:p-8 shadow-xl shadow-bella-200/50">
          <h1 class="text-3xl font-bold leading-tight">Recuperar contraseña</h1>
          <p class="mt-2 text-sm text-tinta/80">Para comprobar que la cuenta es tuya, escribe tu usuario y el teléfono o correo con el que te registraste. Tienes 3 intentos.</p>

          <div id="alerta" class="alerta mt-6"></div>

          <form id="formRecuperar" class="mt-6 space-y-5">
            <div>
              <label for="usuario" class="etiqueta text-sm">Usuario</label>
              <input id="usuario" class="campo py-3 text-base" type="text" autocomplete="username" required>
            </div>
            <div>
              <label for="contacto" class="etiqueta text-sm">Teléfono o correo registrado</label>
              <input id="contacto" class="campo py-3 text-base" type="text" autocomplete="off" placeholder="3001234567 o tu@correo.com" required>
            </div>
            <div>
              <label for="nueva" class="etiqueta text-sm">Nueva contraseña</label>
              <input id="nueva" class="campo py-3 text-base" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <div>
              <label for="confirmar" class="etiqueta text-sm">Confirmar contraseña</label>
              <input id="confirmar" class="campo py-3 text-base" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn-primario w-full py-3.5 text-base">Cambiar contraseña</button>
          </form>

          <p class="mt-6 text-center text-sm">
            <a href="index.html" class="font-medium text-tinta/80 hover:text-bella-800 transition">Volver a iniciar sesión</a>
          </p>
        </section>
      </main>

      <footer class="border-t border-tinta/10 py-4 text-center text-xs text-tinta/60">
        BellaStyle Manager · Proyecto de Aula · Ingeniería de Sistemas
      </footer>

    </div>
  

  <script src="js/api.js?v=51"></script>
  <script src="js/ojoPassword.js?v=49"></script>
  <script>
    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alerta = document.getElementById('alerta');
      const nueva = document.getElementById('nueva').value;

      if (nueva !== document.getElementById('confirmar').value) {
        return mostrarAlerta(alerta, 'Las contraseñas no coinciden.');
      }

      const respuesta = await pedir('/recuperar-password', 'POST', {
        username: document.getElementById('usuario').value.trim(),
        contacto: document.getElementById('contacto').value.trim(),
        nuevaPassword: nueva
      });

      if (respuesta.success) {
        mostrarAlerta(alerta, respuesta.message, 'ok');
        e.target.reset();
      } else {
        mostrarAlerta(alerta, respuesta.message);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <meta name="description" content="BellaStyle: agenda tu cita en el salón de belleza en minutos.">
  <meta name="theme-color" content="#f7d3e2">
  <link rel="stylesheet" href="css/estilos.css?v=15">
  <script src="js/tema.js?v=15"></script>
</head>
<body class="pagina-dividida min-h-screen bg-noche-950">

  <div class="lg:grid lg:min-h-screen lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]">
    <!-- Lado izquierdo: video del salón (lo pone js/tema.js). En celular no se muestra. -->
    <aside id="ladoVideo" class="lado-video hidden lg:sticky lg:top-0 lg:block lg:h-screen">
      <div class="absolute inset-x-0 bottom-0 z-10 bg-gradient-to-t from-black/50 to-transparent p-10 pb-24 pt-24">
        <p class="texto-sobre-video font-titulo text-5xl font-bold leading-tight">Vuelve a entrar<br>en un momento.</p>
      </div>
    </aside>

    <!-- Lado derecho: formulario -->
    <div class="flex min-h-screen flex-col">
  <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-5">
    <a href="welcome.html" class="flex items-center gap-2 font-titulo text-2xl font-bold"><img src="img/logo.webp" alt="" class="h-9 w-9 rounded-full shadow-sm"><span>Bella<span class="text-bella-700">Style</span></span></a>
  </header>

  <main class="flex flex-1 items-center justify-center px-5 pb-16">
    <section class="tarjeta animate-aparecer w-full max-w-md p-6 sm:p-8">
      <h1 class="text-3xl font-bold">Recuperar contraseña</h1>
      <p class="mt-2 text-sm text-tinta/80">Escribe tu usuario y la nueva contraseña.</p>

      <div id="alerta" class="alerta mt-6"></div>

      <form id="formRecuperar" class="mt-6 space-y-5">
        <div>
          <label for="usuario" class="etiqueta">Usuario</label>
          <input id="usuario" class="campo" type="text" required>
        </div>
        <div>
          <label for="nueva" class="etiqueta">Nueva contraseña</label>
          <input id="nueva" class="campo" type="password" minlength="6" required>
        </div>
        <div>
          <label for="confirmar" class="etiqueta">Confirmar contraseña</label>
          <input id="confirmar" class="campo" type="password" minlength="6" required>
        </div>
        <button type="submit" class="btn-primario w-full py-3">Cambiar contraseña</button>
      </form>

      <p class="mt-6 text-center text-sm">
        <a href="index.html" class="text-tinta/80 hover:text-bella-800">Volver a iniciar sesión</a>
      </p>
    </section>
  </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alerta = document.getElementById('alerta');
      const nueva = document.getElementById('nueva').value;

      if (nueva !== document.getElementById('confirmar').value) {
        return mostrarAlerta(alerta, 'Las contraseñas no coinciden.');
      }

      const respuesta = await pedir('/recuperar-password', 'POST', {
        username: document.getElementById('usuario').value.trim(),
        nuevaPassword: nueva
      });

      if (respuesta.success) {
        mostrarAlerta(alerta, respuesta.message, 'ok');
        e.target.reset();
      } else {
        mostrarAlerta(alerta, respuesta.message);
      }
    });
  </script>
</body>
</html>

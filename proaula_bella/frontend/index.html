<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css?v=35">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tema.js"></script>
</head>
<body class="pagina-dividida min-h-screen bg-[#0a0810] text-white">

  <div class="md:grid md:min-h-screen md:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]">
    
    <!-- Lado Izquierdo: Ilustración/Vídeo dinámico manejado por js/tema.js -->
    <aside id="ladoVideo" class="lado-video hidden md:sticky md:top-0 md:block md:h-screen">
      <!-- js/tema.js coloca la ilustración correspondiente según el tema -->
    </aside>

    <!-- Lado Derecho: Formulario de Iniciar Sesión -->
    <div class="flex min-h-screen flex-col px-6 py-8 justify-between">
      
      <!-- Navegación superior -->
      <header class="flex items-center justify-between pb-6 border-b border-white/10">
        <a href="welcome.html" class="flex items-center gap-3 shrink-0">
          <img src="img/logo.webp" alt="Logo BellaStyle" class="h-9 w-9 rounded-full object-cover">
          <span class="font-serif text-xl font-bold">Bella<span class="text-pink-400">Style</span></span>
        </a>

        <div class="flex items-center space-x-3">
          <button type="button" class="btn-toggle-tema px-3 py-1.5 text-xs font-semibold rounded-full border border-white/15 bg-white/5 hover:bg-white/15 text-white transition flex items-center gap-1.5"></button>
          <a href="welcome.html" class="text-xs text-white/70 hover:text-white transition">Conoce el salón &rarr;</a>
        </div>
      </header>

      <!-- Tarjeta de Login Principal -->
      <main class="flex-1 flex items-center justify-center py-8">
        <div id="iniciar-sesion" class="tarjeta w-full max-w-md p-8 shadow-2xl">
          
          <div class="flex items-center gap-4 border-b border-white/10 pb-5">
            <img id="imagenRol" src="img/rol_clienta.svg" alt="" class="h-14 w-14 rounded-2xl object-cover shrink-0 bg-white/5 p-1 border border-white/10">
            <div>
              <p class="text-xs uppercase tracking-wider text-white/50 font-semibold">Iniciar sesión como</p>
              <h1 id="tituloRol" class="text-3xl font-bold font-serif">Clienta</h1>
            </div>
          </div>

          <!-- Selector de roles dinámico generado por js/login.js -->
          <div id="listaRoles" class="mt-6 grid grid-cols-3 gap-1 rounded-xl bg-white/5 p-1 text-xs"></div>
          <p id="descripcionRol" class="mt-3 text-xs text-white/60"></p>

          <div id="alerta" class="alerta mt-4"></div>

          <form id="formLogin" class="mt-6 space-y-4">
            <div>
              <label for="usuario" class="etiqueta">Usuario</label>
              <input id="usuario" class="campo" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div>
              <label for="password" class="etiqueta">Contraseña</label>
              <div class="relative">
                <input id="password" class="campo pr-24" type="password" autocomplete="current-password" placeholder="••••••••" required>
                <button type="button" id="verPassword" class="absolute inset-y-1.5 right-1.5 rounded-lg bg-white/10 px-3 text-xs font-semibold text-white/80 hover:bg-white/20 transition">Mostrar</button>
              </div>
            </div>
            <button id="btnEntrar" type="submit" class="btn-primario w-full py-3.5 mt-2">Entrar</button>
          </form>

          <div class="mt-6 flex flex-wrap justify-between gap-2 text-xs text-white/60 pt-4 border-t border-white/5">
            <a href="recuperar.html" class="hover:text-white transition">¿Olvidaste tu contraseña?</a>
            <a id="enlaceRegistro" href="register.html?rol=cliente" class="font-semibold text-pink-400 hover:text-pink-300 transition">Crear cuenta</a>
          </div>

        </div>
      </main>

      <footer class="text-center text-xs text-white/40 pt-4 border-t border-white/5">
        BellaStyle Manager · Proyecto de Aula
      </footer>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

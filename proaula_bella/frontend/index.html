<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:site_name" content="BellaStyle">
  <meta property="og:title" content="BellaStyle · Tu estilo, a un clic de distancia">
  <meta property="og:description" content="Salón de belleza en Cartagena de Indias. Agenda tu cita en línea, paga con QR Bre-B y compra productos. Descarga la app para Android.">
  <meta property="og:url" content="https://bellastyle.onrender.com/index.html">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de BellaStyle: silueta de una mujer con tijeras y peine">
  <meta property="og:locale" content="es_CO">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bellastyle.onrender.com/img/compartir.jpg">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07060b">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/estilos.css?v=45">

  <script src="js/tema.js?v=51"></script>
  <script src="js/pwa.js?v=52" defer></script>
</head>
<body class="bg-[#07050d] text-white min-h-screen flex flex-col font-sans antialiased">
  <header id="encabezado"></header>
  <script src="js/encabezado.js?v=53"></script>
    <div class="flex flex-1 flex-col px-4 sm:px-6 pt-4 pb-24 sm:pb-6">

      <!-- Tarjeta de Login Principal -->
      <main class="relative flex-1 flex items-center justify-center py-8">
        <!-- Silueta del salón de fondo (decorativa) -->
        <div class="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden" aria-hidden="true">
          <div class="md:-translate-x-[16rem] lg:-translate-x-[22rem] xl:-translate-x-[27rem]">
            <div class="animar-flotar">
              <img src="img/silueta-oscuro.webp" alt="" class="silueta silueta-oscuro w-[34rem] md:w-[30rem] lg:w-[38rem] max-w-none opacity-50 md:opacity-80">
              <img src="img/silueta-claro.webp" alt="" class="silueta silueta-claro w-[34rem] md:w-[30rem] lg:w-[38rem] max-w-none opacity-60 md:opacity-90">
            </div>
          </div>
        </div>
        <div id="iniciar-sesion" class="relative z-10 tarjeta w-full max-w-md p-8 shadow-2xl">
          
          <div class="flex items-center gap-4 border-b border-white/10 pb-5">
            <img id="imagenRol" src="img/rol_clienta.svg" alt="" class="h-14 w-14 rounded-2xl object-cover shrink-0 bg-white/5 p-1 border border-white/10">
            <div>
              <p class="text-xs uppercase tracking-wider text-white/50 font-semibold">Iniciar sesión como</p>
              <h1 id="tituloRol" class="text-3xl font-bold font-serif">Clienta</h1>
            </div>
          </div>

          <!-- Selector de roles dinámico generado por js/login.js -->
          <div id="listaRoles" class="mt-6 grid grid-cols-3 gap-1 rounded-xl bg-white/5 p-1 text-xs"></div>
          <p id="descripcionRol" class="mt-3 text-xs text-white/60"></p>

          <div id="alerta" class="alerta mt-4"></div>

          <form id="formLogin" class="mt-6 space-y-4">
            <div>
              <label for="usuario" class="etiqueta">Usuario</label>
              <input id="usuario" class="campo" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div>
              <label for="password" class="etiqueta">Contraseña</label>
              <input id="password" class="campo" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button id="btnEntrar" type="submit" class="btn-primario w-full py-3.5 mt-2">Entrar</button>
          </form>

          <div class="mt-6 flex flex-wrap justify-between gap-2 text-xs text-white/60 pt-4 border-t border-white/5">
            <a href="recuperar.html" class="hover:text-white transition">¿Olvidaste tu contraseña?</a>
            <a id="enlaceRegistro" href="register.html?rol=cliente" class="font-semibold text-pink-400 hover:text-pink-300 transition">Crear cuenta</a>
          </div>

        </div>
      </main>

      <footer class="text-center text-xs text-white/40 pt-4 border-t border-white/5">
        BellaStyle Manager · Proyecto de Aula
      </footer>

    </div>
  

  <script src="js/api.js?v=51"></script>
  <script src="js/login.js?v=42"></script>
  <script src="js/ojoPassword.js?v=49"></script>
  <script src="js/chat.js?v=45"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css?v=70">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tema.js"></script>
</head>
<body class="pagina-dividida min-h-screen bg-[#07050d] text-white">

  <div class="md:grid md:min-h-screen md:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]">
    
    <!-- Lado Izquierdo: GIF/Vídeo manejado por js/tema.js -->
    <aside id="ladoVideo" class="lado-video hidden md:sticky md:top-0 md:block md:h-screen">
      <div class="absolute inset-x-0 bottom-0 z-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-10 pb-20">
        <p class="font-serif text-4xl sm:text-5xl font-bold leading-tight">Tu próxima cita<br>empieza aquí.</p>
        <p class="mt-2 text-sm text-white/80">Únete a BellaStyle Manager en Cartagena</p>
      </div>
    </aside>

    <!-- Lado Derecho: Formulario de Registro -->
    <div class="flex min-h-screen flex-col px-6 py-8 justify-between">
      
      <header class="flex items-center justify-between pb-6 border-b border-white/10">
        <a href="welcome.html" class="flex items-center gap-3 shrink-0">
          <img src="img/logo.webp" alt="Logo BellaStyle" class="h-9 w-9 rounded-full object-cover shadow-md shadow-pink-500/20">
          <span class="font-serif text-xl font-bold">Bella<span class="text-pink-400">Style</span></span>
        </a>

        <div class="flex items-center space-x-3">
          <button type="button" class="btn-toggle-tema px-3 py-1.5 text-xs font-semibold rounded-full border border-white/15 bg-white/5 hover:bg-white/15 text-white transition flex items-center gap-1.5"></button>
          <a href="index.html" class="text-xs text-white/70 hover:text-white transition">Ya tengo cuenta &rarr;</a>
        </div>
      </header>

      <main class="flex-1 flex items-center justify-center py-8">
        <section class="tarjeta w-full max-w-xl p-8 shadow-2xl">

          <!-- Selector de Rol dinámico -->
          <div id="selectorRol" class="grid grid-cols-3 gap-1 rounded-xl bg-white/5 p-1 text-xs"></div>

          <div class="mt-6 flex items-center gap-4">
            <img id="imagenRol" src="img/rol_clienta.svg" alt="" class="h-14 w-14 rounded-2xl object-cover shrink-0 bg-white/5 p-1 border border-white/10">
            <div>
              <p class="text-xs uppercase tracking-wider text-white/50 font-semibold">Crear cuenta de</p>
              <h1 id="tituloRol" class="text-3xl font-bold font-serif leading-none">Clienta</h1>
            </div>
          </div>

          <div id="alerta" class="alerta mt-4"></div>

          <form id="formRegistro" class="mt-6 space-y-4">
            <div>
              <label for="nombre" class="etiqueta">Nombre completo</label>
              <input id="nombre" class="campo" type="text" placeholder="Ej: Ana María López" required>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="usuario" class="etiqueta">Usuario</label>
                <input id="usuario" class="campo" type="text" placeholder="anamaria" autocomplete="username" required>
              </div>
              <div>
                <label for="password" class="etiqueta">Contraseña</label>
                <input id="password" class="campo" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
              </div>
            </div>

            <!-- Campos solo para Clienta -->
            <div data-solo="cliente" class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="telefono" class="etiqueta">Teléfono</label>
                <input id="telefono" class="campo" type="tel" inputmode="numeric" maxlength="10" placeholder="3001234567">
              </div>
              <div>
                <label for="email" class="etiqueta">Correo electrónico</label>
                <input id="email" class="campo" type="email" placeholder="tu@correo.com">
              </div>
              <div class="sm:col-span-2">
                <label for="profesion" class="etiqueta">Profesión u ocupación (opcional)</label>
                <input id="profesion" class="campo" maxlength="80" list="listaProfesiones" placeholder="Ej: Enfermera, docente, estudiante...">
                <datalist id="listaProfesiones">
                  <option value="Estudiante"><option value="Docente"><option value="Enfermera">
                  <option value="Médica"><option value="Abogada"><option value="Ingeniera">
                  <option value="Contadora"><option value="Comerciante"><option value="Ama de casa"><option value="Independiente">
                </datalist>
              </div>
            </div>

            <!-- Campos solo para Estilista -->
            <div data-solo="estilista" class="space-y-2">
              <label class="etiqueta">Servicios que dominas</label>
              <div id="listaServicios" class="grid gap-2 sm:grid-cols-2 max-h-48 overflow-y-auto p-2 bg-white/5 rounded-xl border border-white/10 text-xs">
                <p class="text-white/60">Cargando catálogo...</p>
              </div>
            </div>

            <!-- Campos solo para Administradora -->
            <div data-solo="admin">
              <label for="codigo" class="etiqueta">Código de administradora</label>
              <input id="codigo" class="campo" type="password" placeholder="Código maestro entregado por la dueña">
            </div>

            <button id="btnRegistrar" type="submit" class="btn-primario w-full py-3.5 mt-4">Crear mi cuenta</button>
          </form>

        </section>
      </main>

      <footer class="text-center text-xs text-white/40 pt-4 border-t border-white/5">
        BellaStyle Manager · Proyecto de Aula · Ingeniería de Sistemas
      </footer>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>

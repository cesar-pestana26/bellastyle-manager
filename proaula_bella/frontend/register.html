<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | BellaStyle</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <meta name="description" content="BellaStyle: agenda tu cita en el salón de belleza en minutos.">
  <meta name="theme-color" content="#f7d3e2">
  <link rel="stylesheet" href="css/estilos.css?v=15">
  <script src="js/tema.js?v=15"></script>
</head>
<body class="pagina-dividida min-h-screen bg-noche-950">

  <div class="lg:grid lg:min-h-screen lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]">
    <!-- Lado izquierdo: video del salón (lo pone js/tema.js). En celular no se muestra. -->
    <aside id="ladoVideo" class="lado-video hidden lg:sticky lg:top-0 lg:block lg:h-screen">
      <div class="absolute inset-x-0 bottom-0 z-10 bg-gradient-to-t from-black/50 to-transparent p-10 pb-24 pt-24">
        <p class="texto-sobre-video font-titulo text-5xl font-bold leading-tight">Tu próxima cita<br>empieza aquí.</p>
      </div>
    </aside>

    <!-- Lado derecho: formulario -->
    <div class="flex min-h-screen flex-col">
  <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-5">
    <a href="welcome.html" class="flex items-center gap-2 font-titulo text-2xl font-bold"><img src="img/logo.webp" alt="" class="h-9 w-9 rounded-full shadow-sm"><span>Bella<span class="text-bella-700">Style</span></span></a>
    <a href="index.html" class="text-sm text-tinta/80 transition hover:text-tinta">Ya tengo cuenta</a>
  </header>

  <main class="mx-auto max-w-xl px-5 pb-12 pt-2">
    <section class="tarjeta animate-aparecer p-6 sm:p-8">

      <!-- Selector de rol -->
      <div id="selectorRol" class="grid grid-cols-3 gap-1 rounded-xl bg-tinta/5 p-1"></div>

      <div class="mt-6 flex items-center gap-4">
        <img id="imagenRol" src="img/rol_clienta.svg" alt="" class="h-14 w-14 rounded-2xl object-cover shadow-sm">
        <div>
          <p class="text-xs uppercase tracking-wider text-tinta/80">Crear cuenta de</p>
          <h1 id="tituloRol" class="text-3xl font-bold">Clienta</h1>
        </div>
      </div>

      <div id="alerta" class="alerta mt-6"></div>

      <form id="formRegistro" class="mt-6 space-y-5">
        <div>
          <label for="nombre" class="etiqueta">Nombre completo</label>
          <input id="nombre" class="campo" type="text" placeholder="Ej: Ana María López" required>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="usuario" class="etiqueta">Usuario</label>
            <input id="usuario" class="campo" type="text" placeholder="Ej: anamaria" required>
          </div>
          <div>
            <label for="password" class="etiqueta">Contraseña</label>
            <input id="password" class="campo" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
          </div>
        </div>

        <!-- Solo para clienta -->
        <div data-solo="cliente" class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="telefono" class="etiqueta">Teléfono</label>
            <input id="telefono" class="campo" type="tel" placeholder="300 000 0000">
          </div>
          <div>
            <label for="email" class="etiqueta">Correo</label>
            <input id="email" class="campo" type="email" placeholder="tu@correo.com">
          </div>
          <div class="sm:col-span-2">
            <label for="profesion" class="etiqueta">Profesión u ocupación (opcional)</label>
            <input id="profesion" class="campo" maxlength="80" list="listaProfesiones" placeholder="Ej: Enfermera, docente, estudiante...">
            <datalist id="listaProfesiones"><option value="Estudiante"><option value="Docente"><option value="Enfermera"><option value="Médica"><option value="Abogada"><option value="Ingeniera"><option value="Contadora"><option value="Comerciante"><option value="Ama de casa"><option value="Independiente"></datalist>
            <p class="mt-1 text-xs text-tinta/70">Nos ayuda a recomendarte estilos prácticos para tu día a día.</p>
          </div>
        </div>

        <!-- Solo para estilista -->
        <div data-solo="estilista">
          <p class="etiqueta">Servicios que sabes realizar</p>
          <div id="listaServicios" class="grid gap-2 sm:grid-cols-2">
            <p class="text-sm text-tinta/80">Cargando servicios...</p>
          </div>
        </div>

        <!-- Solo para administradora -->
        <div data-solo="admin">
          <label for="codigo" class="etiqueta">Código de administradora</label>
          <input id="codigo" class="campo" type="password" placeholder="Te lo entrega la dueña del salón">
        </div>

        <button id="btnRegistrar" type="submit" class="btn-primario w-full py-3">Crear cuenta</button>
      </form>
    </section>
  </main>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
